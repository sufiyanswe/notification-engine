# ==========================================
# Application
# ==========================================
spring.application.name=notification-engine

application.name=notification-engine
application.version=0.6.0-SNAPSHOT

# ==========================================
# Background Worker
# ==========================================
application.worker.batch-size=10
application.worker.poll-interval-ms=1000

# Lease ownership
application.worker.lease-duration-ms=30000

# Abandoned-event recovery
application.worker.recovery-interval-ms=5000

# ==========================================
# Retry
# ==========================================
application.retry.max-retries=5
application.retry.initial-delay-ms=1000
application.retry.multiplier=2.0

# ==========================================
# PostgreSQL
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/notification_engine
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA
# ==========================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ==========================================
# Server
# ==========================================
server.port=8080